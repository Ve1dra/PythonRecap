<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="./index.css" rel="stylesheet">
    </link>
</head>

<body>

    <div id="parent-container" style="display: flex; width: 100vw;">
        <section class="sidebar">

            <div class="up">
                <img src="./assets/Subtract.svg" alt="">
                <h2 id="mm">3MM</h2>
            </div>
            <div class="down">
                <ul>
                    <li><img src="./assets/Home.svg" alt="">Home</li>
                    <li><img src="./assets/person.svg" alt="">Profile</li>
                    <li><img src="./assets/Ticket.svg" alt="">Messages</li>
                    <li><img src="./assets/Document.svg" alt="">Purchases</li>
                    <li><img src="./assets/Calendar.svg" alt="">Returns</li>
                    <li><img src="./assets/Activity.svg" alt="">Gallery</li>
                    <li><img src="./assets/Notification.svg" alt="">Analytics</li>
                    <li><img src="./assets/Setting.svg" alt="">Settings</li>
                </ul>
            </div>

        </section>

        <div class="hero-main">

            <div class="top">
                <input id="search" type="text" placeholder="search">

                <div class="profile-right">
                    <div id="names">
                        <h3 style="font-weight: 700;">Charles Deo</h3>
                        <p>log out</p>
                    </div>
                    <div id="img">
                        <img id="p-img" src="./assets/img& bg.svg" alt="">
                    </div>
                </div>

            </div>

            <div class="first">
                <div class="hero">
                    <img #id="hero-img" src="./assets/unsplash_0aMMMUjiiEQ.svg" alt="">
                    <a id="cvr-edit" href="">Edit cover photo</a>
                </div>

                <a id="cvr-edit2" href="">Edit profile</a>
                <div class="profile-left">
                    <div class="image">
                        <img src="./assets/img& bg.svg" alt="">
                    </div>
                    <div class="intro">
                        <h2>Charles Deo</h2>
                        <p>UI/UX Designer</p>
                    </div>
                </div>

            </div>
        </div>

        <div id="no">
            <h1 id="Note">Still In Development</h1>
        </div>
    </div>

</body>

</html>
